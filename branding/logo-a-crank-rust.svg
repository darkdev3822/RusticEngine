<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
  <filter id="rust" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="5" seed="11" result="lo"/>
    <feColorMatrix in="lo" type="matrix" result="lum"
      values="2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  0 0 0 0 1"/>
    <feComponentTransfer in="lum" result="col">
      <feFuncR type="table" tableValues="0.150 0.260 0.400 0.570 0.710 0.500 0.300"/>
      <feFuncG type="table" tableValues="0.075 0.105 0.165 0.260 0.370 0.230 0.130"/>
      <feFuncB type="table" tableValues="0.050 0.050 0.065 0.100 0.160 0.100 0.070"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="12" result="fl"/>
    <feColorMatrix in="fl" type="matrix"
      values="0 0 0 0 0.40  0 0 0 0 0.36  0 0 0 0 0.33  7.00 0 0 0 -4.30" result="flake"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="13" result="hi"/>
    <feColorMatrix in="hi" type="matrix"
      values="0 0 0 0 0.06  0 0 0 0 0.03  0 0 0 0 0.02  2.31 0 0 0 -1.35" result="pit"/>
    <feMerge result="tex">
      <feMergeNode in="col"/>
      <feMergeNode in="flake"/><feMergeNode in="pit"/>
    </feMerge>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
    <feComposite in="blur" in2="hi" operator="arithmetic" k2="1" k3="0.22" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="5.0" diffuseConstant="1.1" lighting-color="#fff4e6" result="light">
      <feDistantLight azimuth="235" elevation="50"/>
    </feDiffuseLighting>
    <feComposite in="tex" in2="light" operator="arithmetic" k1="1.12" result="lit"/>
    <feSpecularLighting in="height" surfaceScale="5.0" specularConstant=".35" specularExponent="18"
      lighting-color="#ffd9a8" result="spec">
      <feDistantLight azimuth="235" elevation="55"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec2"/>
    <feComposite in="lit" in2="spec2" operator="arithmetic" k2="1" k3="0.5" result="shine"/>
    <feDisplacementMap in="SourceAlpha" in2="lo" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="edge"/>
    <feComposite in="shine" in2="edge" operator="in"/>
  </filter>
  <filter id="rust2" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="5" seed="23" result="lo"/>
    <feColorMatrix in="lo" type="matrix" result="lum"
      values="2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  0 0 0 0 1"/>
    <feComponentTransfer in="lum" result="col">
      <feFuncR type="table" tableValues="0.150 0.260 0.400 0.570 0.710 0.500 0.300"/>
      <feFuncG type="table" tableValues="0.075 0.105 0.165 0.260 0.370 0.230 0.130"/>
      <feFuncB type="table" tableValues="0.050 0.050 0.065 0.100 0.160 0.100 0.070"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="24" result="fl"/>
    <feColorMatrix in="fl" type="matrix"
      values="0 0 0 0 0.40  0 0 0 0 0.36  0 0 0 0 0.33  6.30 0 0 0 -3.87" result="flake"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="25" result="hi"/>
    <feColorMatrix in="hi" type="matrix"
      values="0 0 0 0 0.06  0 0 0 0 0.03  0 0 0 0 0.02  2.31 0 0 0 -1.35" result="pit"/>
    <feMerge result="tex">
      <feMergeNode in="col"/>
      <feMergeNode in="flake"/><feMergeNode in="pit"/>
    </feMerge>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
    <feComposite in="blur" in2="hi" operator="arithmetic" k2="1" k3="0.22" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="5.0" diffuseConstant="1.1" lighting-color="#fff4e6" result="light">
      <feDistantLight azimuth="235" elevation="50"/>
    </feDiffuseLighting>
    <feComposite in="tex" in2="light" operator="arithmetic" k1="1.12" result="lit"/>
    <feSpecularLighting in="height" surfaceScale="5.0" specularConstant=".35" specularExponent="18"
      lighting-color="#ffd9a8" result="spec">
      <feDistantLight azimuth="235" elevation="55"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec2"/>
    <feComposite in="lit" in2="spec2" operator="arithmetic" k2="1" k3="0.5" result="shine"/>
    <feDisplacementMap in="SourceAlpha" in2="lo" scale="2.5" xChannelSelector="R" yChannelSelector="G" result="edge"/>
    <feComposite in="shine" in2="edge" operator="in"/>
  </filter>
  <filter id="iron" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="5" seed="37" result="lo"/>
    <feColorMatrix in="lo" type="matrix" result="lum"
      values="2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  0 0 0 0 1"/>
    <feComponentTransfer in="lum" result="col">
      <feFuncR type="table" tableValues="0.130 0.200 0.290 0.400 0.310 0.220"/>
      <feFuncG type="table" tableValues="0.120 0.160 0.190 0.230 0.200 0.160"/>
      <feFuncB type="table" tableValues="0.110 0.130 0.140 0.150 0.150 0.130"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="38" result="fl"/>
    <feColorMatrix in="fl" type="matrix"
      values="0 0 0 0 0.40  0 0 0 0 0.36  0 0 0 0 0.33  0.00 0 0 0 -0.00" result="flake"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="39" result="hi"/>
    <feColorMatrix in="hi" type="matrix"
      values="0 0 0 0 0.06  0 0 0 0 0.03  0 0 0 0 0.02  3.36 0 0 0 -1.96" result="pit"/>
