    <feComposite in="shine" in2="edge" operator="in"/>
  </filter>
  <filter id="plate" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="5" seed="51" result="lo"/>
    <feColorMatrix in="lo" type="matrix" result="lum"
      values="2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  0 0 0 0 1"/>
    <feComponentTransfer in="lum" result="col">
      <feFuncR type="table" tableValues="0.060 0.090 0.130 0.170 0.120"/>
      <feFuncG type="table" tableValues="0.055 0.075 0.095 0.110 0.090"/>
      <feFuncB type="table" tableValues="0.050 0.065 0.080 0.090 0.075"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.13 0.011" numOctaves="3" seed="54" result="st"/>
    <feColorMatrix in="st" type="matrix"
      values="0 0 0 0 0.34  0 0 0 0 0.14  0 0 0 0 0.06  3.4 0 0 0 -2.05" result="streak"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="52" result="fl"/>
    <feColorMatrix in="fl" type="matrix"
      values="0 0 0 0 0.40  0 0 0 0 0.36  0 0 0 0 0.33  0.00 0 0 0 -0.00" result="flake"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="53" result="hi"/>
    <feColorMatrix in="hi" type="matrix"
      values="0 0 0 0 0.06  0 0 0 0 0.03  0 0 0 0 0.02  2.52 0 0 0 -1.47" result="pit"/>
    <feMerge result="tex">
      <feMergeNode in="col"/><feMergeNode in="streak"/>
      <feMergeNode in="flake"/><feMergeNode in="pit"/>
    </feMerge>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
    <feComposite in="blur" in2="hi" operator="arithmetic" k2="1" k3="0.22" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2" diffuseConstant="1.1" lighting-color="#fff4e6" result="light">
      <feDistantLight azimuth="235" elevation="50"/>
    </feDiffuseLighting>
    <feComposite in="tex" in2="light" operator="arithmetic" k1="1.12" result="lit"/>
    <feSpecularLighting in="height" surfaceScale="2" specularConstant=".35" specularExponent="18"
      lighting-color="#ffd9a8" result="spec">
      <feDistantLight azimuth="235" elevation="55"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec2"/>
    <feComposite in="lit" in2="spec2" operator="arithmetic" k2="1" k3="0.5" result="shine"/>
    <feDisplacementMap in="SourceAlpha" in2="lo" scale="0" xChannelSelector="R" yChannelSelector="G" result="edge"/>
    <feComposite in="shine" in2="edge" operator="in"/>
  </filter>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".6"/>
  </filter>
  <radialGradient id="vignette" cx="50%" cy="45%" r="55%">
    <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
</defs>
