    </feDiffuseLighting>
    <feComposite in="tex" in2="light" operator="arithmetic" k1="1.12" result="lit"/>
    <feSpecularLighting in="height" surfaceScale="4" specularConstant=".35" specularExponent="18"
      lighting-color="#ffd9a8" result="spec">
