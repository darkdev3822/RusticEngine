<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
  <filter id="pipe" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="5" seed="61" result="lo"/>
    <feColorMatrix in="lo" type="matrix" result="lum"
      values="2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  2.3 0 0 0 -0.65  0 0 0 0 1"/>
    <feComponentTransfer in="lum" result="col">
      <feFuncR type="table" tableValues="0.110 0.170 0.260 0.370 0.470 0.300 0.170"/>
      <feFuncG type="table" tableValues="0.090 0.115 0.150 0.200 0.255 0.170 0.100"/>
      <feFuncB type="table" tableValues="0.080 0.085 0.100 0.120 0.145 0.100 0.075"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="62" result="fl"/>
    <feColorMatrix in="fl" type="matrix"
      values="0 0 0 0 0.40  0 0 0 0 0.36  0 0 0 0 0.33  4.20 0 0 0 -2.58" result="flake"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="63" result="hi"/>
    <feColorMatrix in="hi" type="matrix"
      values="0 0 0 0 0.06  0 0 0 0 0.03  0 0 0 0 0.02  2.52 0 0 0 -1.47" result="pit"/>
    <feMerge result="tex">
      <feMergeNode in="col"/>
      <feMergeNode in="flake"/><feMergeNode in="pit"/>
    </feMerge>
    <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
    <feComposite in="blur" in2="hi" operator="arithmetic" k2="1" k3="0.22" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="7" diffuseConstant="1.1" lighting-color="#fff4e6" result="light">
      <feDistantLight azimuth="235" elevation="50"/>
    </feDiffuseLighting>
    <feComposite in="tex" in2="light" operator="arithmetic" k1="1.12" result="lit"/>
    <feSpecularLighting in="height" surfaceScale="7" specularConstant=".35" specularExponent="18"
      lighting-color="#ffd9a8" result="spec">
      <feDistantLight azimuth="235" elevation="55"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec2"/>
    <feComposite in="lit" in2="spec2" operator="arithmetic" k2="1" k3="0.5" result="shine"/>
    <feDisplacementMap in="SourceAlpha" in2="lo" scale="2.0" xChannelSelector="R" yChannelSelector="G" result="edge"/>
    <feComposite in="shine" in2="edge" operator="in"/>
  </filter>
  <filter id="rust" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
